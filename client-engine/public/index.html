<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Engine</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3d36'/%3E%3Cpath d='M7 11l9 6 9-6M7 10h18v13H7z' fill='none' stroke='%23e9f2ec' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f1;--panel:#fff;--ink:#1d2421;--muted:#5f6b66;--line:#e2e0d8;--soft:#efede6;
  --brand:#1f3d36;--brand-ink:#fff;--accent:#2f7a5f;--warn:#a5550e;--warn-bg:#fdf1e3;--bad:#a8322a;--bad-bg:#fbe9e7;--good-bg:#e7f3ec;
  --radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{--bg:#141816;--panel:#1c211f;--ink:#e6ebe8;--muted:#9aa6a0;--line:#2e3632;--soft:#232a27;--brand:#9fd1bd;--brand-ink:#10201a;--accent:#7cc7a5;--warn:#f0b06a;--warn-bg:#33281a;--bad:#f08b80;--bad-bg:#3a201d;--good-bg:#1d2f27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1c211f;--ink:#e6ebe8;--muted:#9aa6a0;--line:#2e3632;--soft:#232a27;--brand:#9fd1bd;--brand-ink:#10201a;--accent:#7cc7a5;--warn:#f0b06a;--warn-bg:#33281a;--bad:#f08b80;--bad-bg:#3a201d;--good-bg:#1d2f27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{font-weight:700;font-size:17px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--brand);display:inline-block}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);display:flex;justify-content:space-between}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--soft);color:var(--ink);font-weight:600}
nav .count{font-size:12px;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:0 7px;line-height:20px}
nav .grow{flex:1}
main{padding:22px 28px 60px;max-width:1180px;width:100%}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;margin:0;flex:1}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
textarea.mail{min-height:170px;font-family:inherit;line-height:1.55}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
label small{font-weight:400;color:var(--muted)}
.note{padding:10px 14px;border-radius:8px;margin:10px 0;background:var(--soft)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.good{background:var(--good-bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:12.5px}
pre.foot{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.5;color:var(--muted);margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--line)}
.mail-card{display:grid;grid-template-columns:260px 1fr;gap:18px}
.mail-card .who{font-size:13.5px}
.mail-card .who b{font-size:15px;display:block}
.log{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:30px}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:420px;z-index:9;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.gate{max-width:420px;margin:12vh auto;padding:0 16px}
code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  nav .grow,.logo{display:none}
  main{padding:16px}
  .grid2,.grid3,.mail-card{grid-template-columns:1fr}
  .row > .grow-text{flex-basis:100%}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div id="gate" class="gate hide">
  <div class="card">
    <h2>Client Engine</h2>
    <p class="sub">Enter the app key you set as <code>APP_KEY</code> in Netlify.</p>
    <input id="keyIn" type="password" autocomplete="current-password" placeholder="App key">
    <div class="row" style="margin-top:12px"><button class="btn primary" id="keyBtn">Open</button><span id="keyErr" class="muted small"></span></div>
  </div>
</div>

<div id="app" class="shell hide">
  <nav id="nav">
    <div class="logo"><i></i>Client Engine</div>
    <button data-view="today">Today</button>
    <button data-view="find">Find people</button>
    <button data-view="prospects">Prospects</button>
    <button data-view="queue">Queue <span class="count hide" id="nQueue"></span></button>
    <button data-view="send">Send</button>
    <button data-view="replies">Replies <span class="count hide" id="nReplies"></span></button>
    <button data-view="results">Results</button>
    <div class="grow"></div>
    <button data-view="products">Products</button>
    <button data-view="settings">Settings</button>
  </nav>
  <main>
    <header class="top">
      <h1 id="title">Today</h1>
      <div class="seg" id="productSeg"></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast hide"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
// ---------------------------------------------------------------- basics
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = { get(k, d) { try { const v = localStorage.getItem('ce.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('ce.' + k, JSON.stringify(v)); } catch {} } };
let KEY = store.get('key', '');
const S = { view: store.get('view', 'today'), product: store.get('product', 'pdfmacro'), setup: null, products: [], senders: [], tokens: {}, sending: {}, busy: false };

function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hide'), ms); }

async function api(action, data = {}) {
  const res = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-app-key': KEY }, body: JSON.stringify({ action, ...data }) });
  const out = await res.json().catch(() => ({ error: 'The server sent back something unexpected (' + res.status + ')' }));
  if (res.status === 401) { showGate('Wrong app key.'); throw new Error('Wrong app key'); }
  if (!res.ok || out.error) throw new Error(out.error || 'Request failed');
  return out;
}
const product = () => S.products.find(p => p.id === S.product) || S.products[0];
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
const fmtTime = d => d ? new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

// ---------------------------------------------------------------- start
function showGate(msg) { $('#app').classList.add('hide'); $('#gate').classList.remove('hide'); $('#keyErr').textContent = msg || ''; $('#keyIn').focus(); }
$('#keyBtn').onclick = async () => { KEY = $('#keyIn').value.trim(); store.set('key', KEY); boot(); };
$('#keyIn').onkeydown = e => { if (e.key === 'Enter') $('#keyBtn').click(); };

async function boot() {
  if (!KEY) return showGate();
  try {
    S.setup = await api('setup.status');
  } catch (e) { if (!/app key/i.test(e.message)) showGate(e.message); return; }
  $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
  S.products = S.setup.products || []; S.senders = S.setup.senders || [];
  if (!S.products.find(p => p.id === S.product)) S.product = S.products[0]?.id;
  renderProductSeg(); go(S.view);
  refreshBadges();
}

function renderProductSeg() {
  $('#productSeg').innerHTML = S.products.map(p => `<button data-p="${p.id}" class="${p.id === S.product ? 'on' : ''}">${esc(p.name)}${p.paused ? ' ⏸' : ''}</button>`).join('');
  $('#productSeg').querySelectorAll('button').forEach(b => b.onclick = () => { S.product = b.dataset.p; store.set('product', S.product); renderProductSeg(); go(S.view); refreshBadges(); });
}
$('#nav').querySelectorAll('button[data-view]').forEach(b => b.onclick = () => go(b.dataset.view));

const TITLES = { today: 'Today', find: 'Find people', prospects: 'Prospects', queue: 'Queue', send: 'Send', replies: 'Replies', results: 'Results', products: 'Products', settings: 'Settings' };
async function go(view) {
  S.view = view; store.set('view', view);
  $('#nav').querySelectorAll('button[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#title').textContent = TITLES[view];
  $('#productSeg').classList.toggle('hide', view === 'settings');
  $('#view').innerHTML = '<div class="empty">Loading…</div>';
  try { await VIEWS[view](); } catch (e) { $('#view').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
}

async function refreshBadges() {
  try {
    const [q, r] = await Promise.all([api('queue.list', { productId: S.product }), api('replies.list', { productId: S.product })]);
    const nq = q.messages.length, nr = r.replies.length;
    $('#nQueue').textContent = nq; $('#nQueue').classList.toggle('hide', !nq);
    $('#nReplies').textContent = nr; $('#nReplies').classList.toggle('hide', !nr);
  } catch {}
}

// ---------------------------------------------------------------- CSV
function detectDelim(text) {
  const first = text.split(/\r?\n/, 1)[0];
  const c = d => first.split(d).length;
  return [['\t', c('\t')], [',', c(',')], [';', c(';')], ['|', c('|')]].sort((a, b) => b[1] - a[1])[0][0];
}
function parseCSV(text, delim) {
  text = text.replace(/^﻿/, '');
  delim = delim || detectDelim(text);
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"' && f === '') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else f += ch;
  }
  row.push(f); if (row.some(x => x !== '')) rows.push(row);
  const head = (rows.shift() || []).map(h => h.trim());
  return { head, rows: rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()]))) };
}
const readFile = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsText(f); });

// ---------------------------------------------------------------- Today
const VIEWS = {};
VIEWS.today = async () => {
  const p = product();
  const [st, q, r, pl, ap] = await Promise.all([
    api('stats', { productId: p.id }), api('queue.list', { productId: p.id }), api('replies.list', { productId: p.id }), api('prospects.list', { productId: p.id, limit: 1 }),
    api('autopilot.status'), api('senders.status').then(x => { S.senders = x.senders; }),
  ]);
  const a = ap.products[p.id] || {};
  const c = pl.counts, drafts = q.messages.filter(m => m.status === 'draft').length, approved = q.messages.length - drafts;
  const mySenders = S.senders.filter(s => s.product_id === p.id);
  const missing = [];
  if (!p.from_name || !p.postal_address) missing.push(`your name and postal address on <a href="#" data-go="products">Products</a>`);
  if (!mySenders.length) missing.push(`a sending inbox in <a href="#" data-go="settings">Settings</a>`);
  if (mySenders.some(s => s.mode !== 'browser') && !ap.serverGmail) missing.push(`the Google service account (<code>GOOGLE_SA_EMAIL</code> and <code>GOOGLE_SA_KEY</code>) in Netlify`);
  $('#view').innerHTML = `
    ${p.paused ? `<div class="note bad"><b>Sending is paused.</b> ${esc(p.paused_reason || '')} <button class="btn small" id="resume">Resume sending</button></div>` : ''}
    ${missing.length ? `<div class="note warn">Before ${esc(p.name)} can send, add ${missing.join(' and ')}.</div>` : ''}
    <div class="card">
      <div class="row"><div class="grow-text" style="flex:1">
        <h2>Autopilot: ${a.on ? '<span class="pill good">On</span>' : a.mode === 'off' ? '<span class="pill">Off</span>' : '<span class="pill warn">Learning</span>'}</h2>
        <p class="sub" style="margin:0">${a.on
          ? `Finding, writing, sending and following up on its own. Drafts the checker scores 8+ send without you; the rest wait in the queue.`
          : a.mode === 'off' ? 'Every email waits for your approval.'
          : `You've approved ${a.approvedByYou} of ${a.needed} first emails${a.editRate != null ? `, editing ${a.editRate}% of recent ones` : ''}. It switches on by itself after ${a.needed}, once you're editing fewer than 15%.`}</p></div>
        <select id="apMode" style="width:auto"><option value="auto">Switch on when ready</option><option value="on">Always on</option><option value="off">Off</option></select>
      </div>
      <div class="row" style="margin-top:12px"><span class="small muted" style="flex:1">It runs every 10 minutes on its own${ap.digestTo ? ' and emails you a summary at 9am' : ''}. Sends go out on weekdays, 8am to 5pm US Central.</span>
        <button class="btn small" data-run="autopilot.research">Write now</button><button class="btn small" data-run="autopilot.send">Send now</button><button class="btn small" data-run="autopilot.replies">Check replies now</button></div>
      <div id="apLog" class="log hide" style="margin-top:10px"></div>
    </div>
    <div class="grid3">
      <div class="stat"><b>${drafts}</b><span>drafts to read</span></div>
      <div class="stat"><b>${approved}</b><span>approved, waiting to send</span></div>
      <div class="stat"><b>${r.replies.length}</b><span>replies to answer</span></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>What needs you</h2>
      <p class="sub">Everything else runs on its own.</p>
      <table>
        <tr><td>Answer replies <span class="muted small">(answers are drafted for you)</span></td><td class="num"><button class="btn small primary" data-go="replies">Open replies (${r.replies.length})</button></td></tr>
        <tr><td>${a.on ? `Drafts the checker scored under 8 <span class="muted small">(optional: approve, fix or drop)</span>` : `Read and approve drafts <span class="muted small">(this is how it learns your voice)</span>`}</td><td class="num"><button class="btn small" data-go="queue">Open queue (${drafts})</button></td></tr>
        ${mySenders.some(s => s.mode === 'browser') ? `<tr><td>Send from your browser inboxes <span class="muted small">(keep the tab open)</span></td><td class="num"><button class="btn small" data-go="send">Open sending</button></td></tr>` : ''}
      </table>
    </div>
    <div class="grid2">
      <div class="card"><h2>People</h2>
        <table>
          ${[['new', 'Waiting for a website check'], ['scanned', 'Ready to write to'], ['drafted', 'Email drafted'], ['contacted', 'In sequence'], ['replied', 'Replied'], ['interested', 'Interested'], ['won', 'Customers'], ['rest', 'Resting (not now)'], ['skipped', 'Skipped']]
            .map(([k, l]) => `<tr><td>${l}</td><td class="num">${c[k] || 0}</td></tr>`).join('')}
        </table>
      </div>
      <div class="card"><h2>Sent today</h2>
        ${mySenders.length ? `<table>${mySenders.map(s => `<tr><td>${esc(s.email)}${s.segment ? ` <span class="pill">${esc(s.segment)}</span>` : ''}</td><td class="num">${s.plan?.warming ? `<span class="pill warn">warming, day ${s.plan.day + 1}</span>` : `${st.sentToday[s.email] || 0} of ${s.plan ? s.plan.coldCap : s.daily_cap}`}</td></tr>`).join('')}</table>` : '<p class="muted">No inbox set up yet.</p>'}
        <h3>So far</h3>
        <table>
          <tr><td>People emailed</td><td class="num">${st.totals.people || 0}</td></tr>
          <tr><td>Replied</td><td class="num">${st.totals.replied || 0}</td></tr>
          <tr><td>Interested or asking</td><td class="num">${st.totals.positive || 0}</td></tr>
          <tr><td>Bought</td><td class="num">${st.totals.won || 0}</td></tr>
        </table>
      </div>
    </div>`;
  wireGo();
  const rb = $('#resume'); if (rb) rb.onclick = async () => { await api('products.resume', { id: p.id }); await reloadProducts(); go('today'); };
  $('#apMode').value = a.mode || 'auto';
  $('#apMode').onchange = async e => { await api('autopilot.mode', { productId: p.id, mode: e.target.value }); go('today'); };
  $('#view').querySelectorAll('[data-run]').forEach(b => b.onclick = async () => {
    const log = $('#apLog'); log.classList.remove('hide'); b.disabled = true;
    try { const r = await api(b.dataset.run); log.textContent = (r.log || []).join('\n') || 'Nothing to do right now.'; }
    catch (e) { log.textContent = 'Error: ' + e.message; }
    b.disabled = false;
  });
};
function wireGo() { $('#view').querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); }); }
async function reloadProducts() { S.setup = await api('setup.status'); S.products = S.setup.products; S.senders = S.setup.senders; renderProductSeg(); }

// ---------------------------------------------------------------- Find
VIEWS.find = async () => {
  const p = product();
  const segOpts = (p.segments || []).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const isRegistry = p.id === 'keephoa';
  const left = (await api('prospects.list', { productId: p.id, limit: 1 })).counts.new || 0;
  $('#view').innerHTML = `
    <div class="card">
      <h2>1. Who to look for</h2>
      <label>Segment</label><select id="fSeg">${segOpts}</select>
      ${isRegistry ? `
        <p class="sub" style="margin-top:12px">KeepHOA prospects come from state HOA registry files (see your outreach plan): Colorado and Virginia first. Download the file from the state, read its terms of use, then import it below.</p>
      ` : `
        <div class="grid2">
          <div><label>Business types <small>one per line</small></label><textarea id="fTypes" placeholder="${p.id === 'pdfmacro' ? 'family law attorney\ndivorce lawyer' : 'plumber\nhvac contractor\nelectrician'}">${esc(store.get('types.' + p.id, ''))}</textarea></div>
          <div><label>Cities <small>one per line, with state</small></label><textarea id="fCities" placeholder="Austin, TX\nDenver, CO">${esc(store.get('cities.' + p.id, ''))}</textarea></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="fQueries">Download queries.txt</button><span class="muted small" id="fQn"></span></div>
        <div class="note" style="margin-top:14px"><b>Nightly, on its own:</b> <button class="btn small" id="fPlan">Add these to the nightly plan</button>
          <span class="small muted">The scraper on your computer runs these searches at night, only while ${esc(p.name)} has fewer than 150 people ready, and never repeats a search within 90 days.</span>
          <div id="fPlanList" class="small" style="margin-top:8px"></div></div>
        <h3>2. Or run the scraper by hand</h3>

const SCOPES = 'https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly';
function connectInbox(email) {
  return new Promise((ok, no) => {
    if (!S.setup.googleClientId) return no(new Error('GOOGLE_CLIENT_ID is not set in Netlify.'));
    if (!window.google?.accounts?.oauth2) return no(new Error('Google sign-in did not load. Check your connection and reload.'));
    const client = google.accounts.oauth2.initTokenClient({
      client_id: S.setup.googleClientId, scope: SCOPES, hint: email, prompt: '',
      callback: async r => {
        if (r.error) return no(new Error(r.error_description || r.error));
        try {
          const prof = await (await fetch('https://gmail.googleapis.com/gmail/v1/users/me/profile', { headers: { Authorization: 'Bearer ' + r.access_token } })).json();
          if (!prof.emailAddress || prof.emailAddress.toLowerCase() !== email) return no(new Error(`You signed in as ${prof.emailAddress || 'another account'}, not ${email}.`));
          S.tokens[email] = { token: r.access_token, until: Date.now() + (r.expires_in - 120) * 1000 };
          ok();
        } catch (e) { no(e); }
      },
      error_callback: e => no(new Error(e.message || 'Google sign-in was closed')),
    });
    client.requestAccessToken();
  });
}
const tokenFor = email => { const t = S.tokens[email]; return t && t.until > Date.now() ? t.token : null; };

  const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { ...opts, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || 'Gmail error ' + res.status);
  return data;
}

const encWord = s => /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(s))) + '?=';

    `From: ${encWord(fromName)} <${from}>`, `To: ${to}`, `Subject: ${encWord(subject)}`,
    `Message-ID: ${messageId}`, `Date: ${new Date().toUTCString()}`, 'MIME-Version: 1.0',
    'Content-Type: text/plain; charset=UTF-8', 'Content-Transfer-Encoding: base64',
  ];
  if (inReplyTo) h.push(`In-Reply-To: ${inReplyTo}`, `References: ${inReplyTo}`);
  const b = btoa(unescape(encodeURIComponent(body.replace(/\r?\n/g, '\r\n')))).replace(/.{76}/g, '$&\r\n');
  return b64url(h.join('\r\n') + '\r\n\r\n' + b);
}

function slog(line) { S.sendLog = (S.sendLog || '') + `${new Date().toLocaleTimeString()}  ${line}\n`; const el = $('#sLog'); if (el) { el.textContent = S.sendLog; el.scrollTop = el.scrollHeight; } }
async function runSender(email) {
  if (S.sending[email]) return; S.sending[email] = true; slog(`${email}: started`);
  while (S.sending[email]) {
    let next;
    try { next = await api('send.next', { sender: email }); } catch (e) { slog(`${email}: ${e.message}`); break; }
    if (next.stop) { slog(`${email}: ${next.reason}`); break; }
    const m = next.message;
    if (!tokenFor(email)) { slog(`${email}: Google sign-in expired. Press Connect, then Start again.`); break; }
    try {
      const r = await sendViaGmail(email, m);
      await api('send.done', { messageId: m.id, sender: email, ...r });
      slog(`${email}: sent to ${m.prospect} <${m.to}> (${next.sentToday + 1}/${next.cap} today)`);
    } catch (e) {
      slog(`${email}: failed for ${m.to}: ${e.message}`);
      await api('send.failed', { messageId: m.id, error: e.message }).catch(() => {});
      if (/reconnect|invalid credentials|401/i.test(e.message)) break;
    }
    refreshBadges();
    const gap = window.CE_TEST_GAP ?? (60000 + Math.random() * 120000);
    slog(`${email}: next in ${Math.round(gap / 1000)}s`);
    const until = Date.now() + gap;
    while (S.sending[email] && Date.now() < until) await sleep(1000);
  }
  S.sending[email] = false; slog(`${email}: stopped`);
  if (S.view === 'send') go('send');
}

function bodyText(payload) {
  const dec = d => { try { return decodeURIComponent(escape(atob(d.replace(/-/g, '+').replace(/_/g, '/')))); } catch { return ''; } };
  const walk = part => {
    if (!part) return '';
    if (part.mimeType === 'text/plain' && part.body?.data) return dec(part.body.data);
    for (const c of part.parts || []) { const t = walk(c); if (t) return t; }
    if (part.mimeType === 'text/html' && part.body?.data) return dec(part.body.data).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, ' ');
    return '';
  };
  return walk(payload);
}
const stripQuoted = t => t.split(/\r?\n(On .{5,200}wrote:|-{2,} ?Original Message|From: .+\r?\nSent: )/)[0].split('\n').filter(l => !l.startsWith('>')).join('\n').trim();
const header = (msg, name) => (msg.payload?.headers || []).find(h => h.name.toLowerCase() === name.toLowerCase())?.value || '';

async function checkReplies(log) {
  let found = 0;
  for (const s of S.senders.filter(x => x.mode === 'browser')) {
    if (!tokenFor(s.email)) { log(`${s.email}: not connected, skipped`); continue; }
    const w = await api('replies.watch', { sender: s.email });
    const known = new Set(w.knownIds);
    log(`${s.email}: checking ${w.threads.length} conversations`);
    for (const t of w.threads) {
      let thread;
      try { thread = await gmail(s.email, `threads/${t.thread_id}?format=full`); } catch (e) { log(`  ${t.name}: ${e.message}`); continue; }
      for (const msg of thread.messages || []) {
        if (known.has(msg.id)) continue;
        const from = header(msg, 'From');
        if (from.toLowerCase().includes(s.email)) continue; // ours
        const r = await api('replies.add', { prospectId: t.id, gmailId: msg.id, from, subject: header(msg, 'Subject'), body: stripQuoted(bodyText(msg.payload)) || msg.snippet || '', date: Number(msg.internalDate) || null });
        if (!r.duplicate) { found++; log(`  ${t.name}: ${r.reply.label}${r.brake ? '. SENDING PAUSED: ' + r.brake : ''}`); }
      }
    }
  }
  return found;
}

  const wireRows = () => $('#sTbl').querySelectorAll('tr[data-s]').forEach(tr => {
    tr.querySelector('[data-del]').onclick = () => tr.remove();
    tr.querySelector('[data-f=product_id]').onchange = e => { const tmp = document.createElement('tbody'); tmp.innerHTML = senderRow({ email: tr.querySelector('[data-f=email]').value, product_id: e.target.value, segment: '', daily_cap: tr.querySelector('[data-f=daily_cap]').value, mode: tr.querySelector('[data-f=mode]').value }); const n = tmp.firstElementChild; tr.replaceWith(n); wireRows(); };
  });
  wireRows();
  $('#sAdd').onclick = () => { $('#sTbl').insertAdjacentHTML('beforeend', senderRow({ email: '', product_id: S.product, segment: '', daily_cap: 10 })); wireRows(); };
  $('#sSave').onclick = async () => {
    const list = [...$('#sTbl').querySelectorAll('tr[data-s]')].map(tr => Object.fromEntries([...tr.querySelectorAll('[data-f]')].map(el => [el.dataset.f, el.type === 'checkbox' ? el.checked : el.value.trim()]))).filter(r => r.email);
    const bad = list.find(r => /@(pdfmacro|keephoa|ringsparrow)\.com$/i.test(r.email));
    if (bad) return toast(`Don't cold-email from ${bad.email.split('@')[1]}: use a separate sending domain.`, 6000);
    try { const r = await api('senders.save', { list }); S.senders = r.senders; toast('Saved.'); go('settings'); } catch (e) { toast(e.message); }
  };
  $('#view').querySelectorAll('[data-dns]').forEach(b => b.onclick = async () => {
    const d = b.dataset.dns, out = $('#dns-' + d.replace(/\./g, '-'));
    b.disabled = true; out.innerHTML = '<p class="muted small">Checking…</p>';
    try {
      const r = await api('dns.check', { domain: d });
      out.innerHTML = `<table style="margin-bottom:12px">${r.checks.map(c => `<tr><td><b>${c.record}</b></td><td>${c.ok ? '<span class="pill good">OK</span>' : '<span class="pill bad">Missing</span>'}</td><td class="small">${c.ok ? esc(c.found) : esc(c.fix)}</td></tr>`).join('')}</table>`;
    } catch (e) { out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
    b.disabled = false;
  });
  $('#supAdd').onclick = async () => { const e = $('#supIn').value.trim(); if (!e) return; await api('suppress.add', { email: e, reason: 'added by you' }); go('settings'); };
  $('#theme').onclick = () => { const order = ['auto', 'light', 'dark']; const t = order[(order.indexOf(store.get('theme', 'auto')) + 1) % 3]; store.set('theme', t); applyTheme(); go('settings'); };
  $('#signout').onclick = () => { store.set('key', ''); KEY = ''; showGate(); };
};

function applyTheme() { const t = store.get('theme', 'auto'); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }
applyTheme();
boot();
</script>
</body>
</html>
